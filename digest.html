<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Digest · Nigeria AI Repository</title>
<meta name="description" content="Every edition of the Nigeria AI Collective Community Monthly Digest.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="index.html"><b class="mark">✦</b><span>Nigeria AI Repository</span></a>
  <div class="links">
    <a href="index.html">Explore</a>
    <a href="digest.html" class="active">Digest</a>
    <a href="contributors.html">Contributors</a>
    <a class="gh" href="https://github.com/aicollectiveng/Nigeria-AI-Repository">GitHub</a>
    <button class="btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
</div></nav>

<header class="hero" style="padding-bottom:84px">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="eyebrow">Community Monthly Digest</div>
    <h1>Key resources, insights and <span class="hl">hot topics</span> in AI</h1>
    <p id="intro"></p>
  </div>
</header>

<main class="wrap">
  <section class="latest" id="latest"></section>

  <div class="toolbar">
    <div class="chips" id="filters" style="margin:0"></div>
    <input class="search" id="q" type="search" placeholder="Search digests…" aria-label="Search digests" style="max-width:300px;padding:10px 16px;font-size:14px;box-shadow:none">
  </div>
  <div class="digests" id="list"></div>
</main>

<footer>
  <a href="index.html">Explore</a>
  <a href="contributors.html">Contributors</a>
  <a href="https://bit.ly/AI-Collective-Com-Onboard">Join the community</a>
  <div style="margin-top:8px">Nigeria Artificial Intelligence Industry Collective · CC0-1.0</div>
</footer>

<script src="digests.js"></script>
<script src="common.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const all = [...DIGESTS].sort((a,b) => b.sort.localeCompare(a.sort));
const view = d => DIGEST_FOLDER + encodeURIComponent(d.file);
const raw  = d => DIGEST_RAW + encodeURIComponent(d.file);
const totalPages = all.reduce((s,d) => s + d.pages, 0);

document.getElementById('intro').textContent =
  `${all.length} editions and ${totalPages} pages of news, papers, opportunities and events from Nigeria's AI ecosystem.`;

// Latest edition spotlight
const L = all[0];
document.getElementById('latest').innerHTML = `
  <a href="${view(L)}" target="_blank" rel="noopener"><img src="images/digest/${esc(L.cover)}" alt="Cover of the ${esc(L.title)} digest"></a>
  <div>
    <span class="tag">Latest edition</span>
    <h2>${esc(L.title)}</h2>
    <div style="color:var(--muted);font-weight:600">${esc(L.label)} · ${L.pages} pages</div>
    <ul>${L.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
    <div class="actions">
      <a class="primary" style="background:var(--navy);color:#fff" href="${view(L)}" target="_blank" rel="noopener">Read now</a>
      <a style="border:1.5px solid var(--line)" href="${raw(L)}" download>Download PDF</a>
    </div>
  </div>`;

// Filters: All / Year / Special editions
const years = [...new Set(all.map(d => d.sort.slice(0,4)))];
const opts = ["All", ...years, "Special editions"];
let f = "All";
const filters = document.getElementById('filters');
filters.innerHTML = opts.map(o => `<button class="chip${o==="All"?" active":""}" data-f="${o}">${o}</button>`).join('');
filters.onclick = e => { const b = e.target.closest('.chip'); if(!b) return; f = b.dataset.f;
  filters.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === b)); render(); };
document.getElementById('q').oninput = render;

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = all.filter(d =>
    (f === "All" || (f === "Special editions" ? d.edition === "Special" : d.sort.startsWith(f))) &&
    (!q || (d.title+" "+d.label+" "+d.highlights.join(" ")).toLowerCase().includes(q)));
  document.getElementById('list').innerHTML = list.length ? list.map((d,i) => `
    <article class="digest" style="animation-delay:${i*50}ms">
      <a class="thumb" href="${view(d)}" target="_blank" rel="noopener">
        <img src="images/digest/${esc(d.cover)}" alt="Cover of the ${esc(d.title)} digest" loading="lazy">
        <span class="badge ${d.edition==="Special"?"special":""}">${d.edition==="Special"?"Special edition":"Monthly"}</span>
        <span class="pages">${d.pages} pages</span>
      </a>
      <div class="body">
        <h3>${esc(d.title)}</h3>
        <div class="sub">${esc(d.label)}</div>
        <ul>${d.highlights.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
        <div class="actions">
          <a class="read" href="${view(d)}" target="_blank" rel="noopener">Read</a>
          <a class="dl" href="${raw(d)}" download>Download</a>
        </div>
      </div>
    </article>`).join('') : `<div class="empty">No digest matches that search.</div>`;
}
render();
</script>
</body>
</html>
